version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: loanpilot_postgres
    environment:
      POSTGRES_DB: loanpilot_db
      POSTGRES_USER: loanpilot_user
      POSTGRES_PASSWORD: loanpilot_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loanpilot_user -d loanpilot_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: loanpilot_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: loanpilot_backend
    environment:
      DB_ENGINE: postgresql
      POSTGRES_DB: loanpilot_db
      POSTGRES_USER: loanpilot_user
      POSTGRES_PASSWORD: loanpilot_pass
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SECRET_KEY: django-insecure-prod-super-secret-key-loanpilot-2026
    command: >
      sh -c "python manage.py makemigrations &&
             python manage.py migrate &&
             python manage.py seed_bre_rules &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: loanpilot_celery
    command: celery -A config worker --loglevel=info
    environment:
      DB_ENGINE: postgresql
      POSTGRES_DB: loanpilot_db
      POSTGRES_USER: loanpilot_user
      POSTGRES_PASSWORD: loanpilot_pass
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      - backend
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
    container_name: loanpilot_frontend
    environment:
      NEXT_PUBLIC_API_URL: /api
    ports:
      - "3000:3000"
    depends_on:
      - backend

  nginx:
    image: nginx:1.25-alpine
    container_name: loanpilot_nginx
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
