name: LoanPilot Production CD Deploy

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    name: Build & Push Container Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Owner Name
        id: repo_owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/loanpilot-backend:latest
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/loanpilot-backend:${{ github.sha }}

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/loanpilot-frontend:latest
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/loanpilot-frontend:${{ github.sha }}

  deploy-to-vps:
    name: Deploy to Production VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    if: secrets.SERVER_HOST != ''
    steps:
      - name: SSH Deploy to Production Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /var/www/loanpilot || exit 1
            git pull origin main
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
